<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Basic Calculator</title>
</head>

<body>
    <div id="window">
        <!--Initially, the display shows 0-->
        <div id="display">0</div>
        <div id="buttons-section">
            <button class="math-operator" id="add"></button>
            <button class="math-operator" id="subtract"></button>
            <button class="math-operator" id="divide"></button>
            <button id="clear"></button>
            <button class="number" id="nine"></button>
            <button class="math-operator" id="power"></button>
            <button class="math-operator" id="multiply"></button>
            <button class="math-operator" id="modulus"></button>
            <button class="number" id="five"></button>
            <button class="number" id="six"></button>
            <button class="number" id="seven"></button>
            <button class="number" id="eight"></button>
            <button class="number" id="one"></button>
            <button class="number" id="two"></button>
            <button class="number" id="three"></button>
            <button class="number" id="four"></button>
            <button class="number" id="zero"></button>
            <button id="period"></button>
            <button id="sign-change"></button>
            <button id="evaluate"></button>
        </div>
    </div>
</body>

</html>
